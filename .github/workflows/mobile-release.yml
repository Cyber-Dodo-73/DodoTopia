# Publication d'une version de DodoTopia Mobile (Android).
# Déclenchée par un push sur main qui modifie mobile/app/build.gradle.kts (ou à la main : Actions > Mobile release).
# Rien n'est publié si le versionName n'a pas changé depuis la dernière version en ligne.
# 1. tests et lint de l'appli
# 2. APK release signé avec la clé de l'éditeur (secrets MOBILE_KEYSTORE_B64, MOBILE_KEYSTORE_PASSWORD,
#    MOBILE_KEY_ALIAS, MOBILE_KEY_PASSWORD) ; l'empreinte du certificat est comparée à MOBILE_CERT_SHA256 :
#    un APK signé d'une autre clé ne s'installerait pas par-dessus l'appli des joueurs.
# 3. release GitHub « mobile-vX.Y.Z » avec l'APK et son SHA-256 (pour les humains)
# 4. publish_mobile.py -> PUT de l'APK + POST publish sur le serveur (secrets PUBLISH_URL / PUBLISH_TOKEN) :
#    c'est le serveur qui alimente la page Téléchargement et la mise à jour dans l'appli.
# Canal à part de release.yml : les versions PC ne sont pas touchées.
name: Mobile release

on:
  push:
    branches: [main]
    paths:
      - mobile/app/build.gradle.kts
  workflow_dispatch:

concurrency:
  group: mobile-release
  cancel-in-progress: false

env:
  # Empreinte SHA-256 du certificat de signature de DodoTopia Mobile (publique : elle se lit dans tout APK publié).
  MOBILE_CERT_SHA256: 80485544b672cdbb6b2bf5ec0c72cbbb1e273f4df59e9aee661ef333d5978bbd

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Lire versionName
        id: version
        run: |
          V=$(sed -n 's/.*versionName *= *"\([^"]*\)".*/\1/p' mobile/app/build.gradle.kts | head -1)
          if [ -z "$V" ]; then echo "versionName introuvable dans mobile/app/build.gradle.kts"; exit 1; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version : $V"

      - name: Clé de signature
        id: sign
        working-directory: mobile
        env:
          KEYSTORE_B64: ${{ secrets.MOBILE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.MOBILE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MOBILE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.MOBILE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Secrets MOBILE_KEYSTORE_* absents : l'APK sera signé avec une clé de test et ne sera pas publié."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dodotopia-mobile.jks"
          {
            echo "storeFile=$RUNNER_TEMP/dodotopia-mobile.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Tests, lint et APK release
        working-directory: mobile
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease

      - name: Vérifier la signature
        if: steps.sign.outputs.signed == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SORTIE=$("$APKSIGNER" verify --print-certs mobile/app/build/outputs/apk/release/app-release.apk)
          echo "$SORTIE"
          # La ligne commence par « Signer #1 certificate » ou « Signer (minSdkVersion=…) certificate » selon la version d'apksigner.
          CERT=$(echo "$SORTIE" | grep -i 'certificate SHA-256 digest' | head -1 | awk '{print $NF}')
          echo "Certificat : $CERT"
          if [ "$CERT" != "$MOBILE_CERT_SHA256" ]; then
            echo "::error::L'APK n'est pas signé avec la clé de DodoTopia Mobile : il ne s'installerait pas par-dessus l'appli des joueurs."
            exit 1
          fi

      - name: Nommer l'APK
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p mobile/dist
          cp mobile/app/build/outputs/apk/release/app-release.apk "mobile/dist/DodoTopia-Mobile-$VERSION.apk"
          (cd mobile/dist && sha256sum "DodoTopia-Mobile-$VERSION.apk" | tee "DodoTopia-Mobile-$VERSION.apk.sha256")

      - name: Effacer la clé
        if: always()
        run: rm -f "$RUNNER_TEMP/dodotopia-mobile.jks" mobile/keystore.properties

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: mobile/dist/
          if-no-files-found: error
          retention-days: 14

  github-release:
    needs: build
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # création du tag et de la release
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: android
          path: mobile/dist

      - name: Notes de version (section de mobile/CHANGELOG.md)
        run: |
          python3 -c "import sys,pathlib;sys.path.insert(0,'.');from publish_release import notes_for_version;f=pathlib.Path('mobile/CHANGELOG.md');t=f.read_text(encoding='utf-8-sig') if f.is_file() else '';n=notes_for_version(t,sys.argv[1]) if t else None;pathlib.Path('notes.md').write_text(n or ('DodoTopia Mobile '+sys.argv[1]),encoding='utf-8')" "$VERSION"
          cat notes.md

      - name: Créer ou mettre à jour la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la mobile/dist/
          if gh release view "mobile-v$VERSION" >/dev/null 2>&1; then
            gh release upload "mobile-v$VERSION" mobile/dist/* --clobber
            gh release edit "mobile-v$VERSION" --notes-file notes.md
          else
            # --latest=false : « Latest » reste la version PC.
            gh release create "mobile-v$VERSION" mobile/dist/* --title "DodoTopia Mobile $VERSION" --notes-file notes.md --latest=false
          fi

  publish:
    needs: build
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: android
          path: mobile/dist

      - name: Publier sur le serveur
        env:
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_URL" ] || [ -z "$PUBLISH_TOKEN" ]; then
            echo "::warning::Secrets PUBLISH_URL / PUBLISH_TOKEN absents : l'APK est construit (artefact, release GitHub) mais pas publié sur le site."
            exit 0
          fi
          # Le serveur est redéployé par le même push : on attend que le canal Android réponde (404 no_release = prêt).
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLISH_URL/api/mobile/latest" || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "404" ]; then
              BODY=$(curl -s "$PUBLISH_URL/api/mobile/latest" || true)
              if [ "$CODE" = "200" ] || echo "$BODY" | grep -q "no_release"; then break; fi
            fi
            echo "Canal Android pas encore en ligne (HTTP $CODE), nouvel essai dans 20 s…"
            sleep 20
          done
          # Même version déjà en ligne (push qui ne change pas versionName) : rien à faire.
          if curl -s "$PUBLISH_URL/api/mobile/latest" | grep -q "\"version\": *\"$VERSION\""; then
            echo "La version Android $VERSION est déjà publiée : rien à faire."
            exit 0
          fi
          python3 publish_mobile.py --version "$VERSION" --apk "mobile/dist/DodoTopia-Mobile-$VERSION.apk" --notes-file mobile/CHANGELOG.md

# Publication d'une version de DodoTopia.
# Déclenchée par un push sur main qui modifie version.py (ou à la main : Actions > Release > Run workflow).
# 1. version       : lit VERSION dans version.py
# 2. build-windows : build.bat -> release/DodoTopia-<v>-Setup.exe + -portable.zip
# 3. build-linux   : docker/Dockerfile.linux -> release/DodoTopia-<v>-linux-x64.tar.gz
# 4. github-release: tag vX.Y.Z + release GitHub avec les binaires attaches (page de telechargement publique)
# 5. publish       : publish_release.py -> PUT des binaires + POST publish sur le serveur (secrets PUBLISH_URL/PUBLISH_TOKEN,
#                    RELEASE_SIGNING_KEY = cle privee Ed25519 base64 qui signe le manifeste ; voir `py publish_release.py --gen-key`)
#                    C'est le serveur qui alimente la mise a jour automatique ; la release GitHub est pour les humains.
name: Release

on:
  push:
    branches: [main]
    paths:
      - version.py
  workflow_dispatch:
    inputs:
      version:
        description: "Version attendue (doit être égale à VERSION dans version.py ; vide = lue dans version.py)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Lire VERSION dans version.py
        id: read
        env:
          WANTED: ${{ github.event.inputs.version }}
        run: |
          V=$(python3 -c "import re,sys; m=re.search(r'VERSION\s*=\s*\"([^\"]+)\"', open('version.py', encoding='utf-8').read()); print(m.group(1) if m else '')")
          if [ -z "$V" ]; then echo "VERSION introuvable dans version.py"; exit 1; fi
          if [ -n "$WANTED" ] && [ "$WANTED" != "$V" ]; then
            echo "La version demandée ($WANTED) ne correspond pas à version.py ($V) : modifie version.py d'abord."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version : $V"

  build-windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: build.bat (dépendances, PyInstaller, installeur, zip portable)
        shell: cmd
        env:
          PYTHON: python
        run: call build.bat

      - name: Vérifier les artefacts
        shell: bash
        run: |
          ls -la release/
          test -f "release/DodoTopia-$VERSION-Setup.exe" || { echo "Installeur absent (Inno Setup ?)"; exit 1; }
          test -f "release/DodoTopia-$VERSION-portable.zip" || { echo "Zip portable absent"; exit 1; }

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            release/DodoTopia-${{ env.VERSION }}-Setup.exe
            release/DodoTopia-${{ env.VERSION }}-portable.zip
          if-no-files-found: error
          retention-days: 14

  build-linux:
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Image de construction (Ubuntu 22.04 + PyInstaller + test de fumée + vérification sur Debian 13)
        run: docker build -f docker/Dockerfile.linux -t dodotopia-linux .

      - name: Extraire l'archive
        run: |
          mkdir -p release
          docker run --rm -v "$PWD/release:/out" dodotopia-linux
          test -f "release/DodoTopia-$VERSION-linux-x64.tar.gz"

      - name: Contrôler l'archive (gzip simple, pas de Mesa ni de libstdc++ embarqués, CGU et droits)
        run: bash .tools/check_linux_bundle.sh "release/DodoTopia-$VERSION-linux-x64.tar.gz"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: release/DodoTopia-${{ env.VERSION }}-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 14

  github-release:
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write          # creation du tag et de la release
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Notes de version (section du CHANGELOG)
        run: |
          python3 -c "import sys,pathlib;sys.path.insert(0,'.');from publish_release import notes_for_version;f=pathlib.Path('CHANGELOG.md');t=f.read_text(encoding='utf-8') if f.exists() else '';n=notes_for_version(t,'$VERSION') if t else None;print(n or 'DodoTopia $VERSION')" > notes.md
          cat notes.md

      - name: Creer ou mettre a jour la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la release/
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "La release v$VERSION existe : mise a jour des binaires et des notes."
            gh release upload "v$VERSION" release/* --clobber
            gh release edit "v$VERSION" --notes-file notes.md --latest
          else
            gh release create "v$VERSION" release/* --title "DodoTopia $VERSION" --notes-file notes.md --latest
          fi

  publish:
    needs: [version, build-windows, build-linux]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: release
          merge-multiple: true

      - name: Publier sur le serveur
        env:
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          ls -la release/
          if [ -z "$PUBLISH_URL" ] || [ -z "$PUBLISH_TOKEN" ]; then
            echo "::warning::Secrets PUBLISH_URL / PUBLISH_TOKEN absents : les binaires sont construits et"\
                 "disponibles en artefacts, mais rien n'est publié. Ajoute-les dans Settings > Secrets and"\
                 "variables > Actions, puis relance ce workflow (Actions > Release > Run workflow)."
            exit 0
          fi
          if [ -f CHANGELOG.md ]; then
            NOTES=(--notes-file CHANGELOG.md)
          else
            NOTES=(--notes "DodoTopia $VERSION")
          fi
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::Secret RELEASE_SIGNING_KEY absent : manifeste publié sans signature (refusé si le serveur exige une signature). Génère la paire avec : py publish_release.py --gen-key"
          else
            python3 -m pip install --quiet pynacl
          fi
          python3 publish_release.py --version "$VERSION" --release-dir release "${NOTES[@]}"

      # Annonce des versions : Discord seulement, envoyée par le serveur (DISCORD_ANNOUNCE_WEBHOOK). L'annonce sur
      # X et Bluesky (.tools/post_social.py) est prête mais volontairement non branchée.

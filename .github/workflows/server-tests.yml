# Tests du serveur (server/) : pytest sur SQLite puis sur PostgreSQL 16.
name: Server tests

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dodo
          POSTGRES_PASSWORD: dodo
          POSTGRES_DB: dodo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dodo -d dodo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Dépendances
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: pytest (SQLite)
        run: python -m pytest -q

      - name: pytest (PostgreSQL)
        env:
          DATABASE_URL: postgresql://dodo:dodo@localhost:5432/dodo_test
        run: python -m pytest -q
